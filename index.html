    <!--
      Urutan penting. Sebagian browser memakai deklarasi PNG bila ada, jadi
      favicon-32.png ditaruh setelah .ico supaya dialah yang dipakai di tab.
      Isinya versi sederhana tanpa palang gerak, yang masih terbaca di ukuran
      mungil; .ico tetap disediakan untuk browser lama dan pintasan desktop.

      ?v=3 memaksa browser mengunduh ulang. Favicon disimpan di cache terpisah
      yang tidak ikut terhapus oleh hard refresh biasa, jadi tanpa penanda ini
      ikon lama bisa bertahan berhari-hari walau berkasnya sudah diganti.
      Naikkan angkanya setiap kali ikonnya berubah lagi — kali ini dinaikkan
      karena seluruh ikon berganti dari PASEK.ID ke SekilasUpdate.com.
    -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-icon-512.png?v=3" />
